services:
  petora-next:
    container_name: petora-next
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3000
    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/petora-next
    working_dir: /usr/src/petora-next

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge

# petora-next:4000 <=> container:3000
# petora-api:4010 <=> container:4000
# petora-batch:4011 <=> container:4001
